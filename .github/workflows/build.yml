name: Build and modeling tests
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'samples/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'samples/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: occt-tutorial
          create-args: >-
            occt=7.9.3
            qt6-main=6.8.4
            cmake>=3.21
            ninja
          cache-environment: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure
        shell: bash -el {0}
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DOCCT_ENABLE_GUI_TESTS=OFF
      - name: Build
        shell: bash -el {0}
        run: cmake --build build-ci --parallel 3
      - name: Modeling and exchange tests
        shell: bash -el {0}
        run: ctest --test-dir build-ci --output-on-failure --output-junit test-results.xml
      - name: Verify Windows user build script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX 'envs\occt-tutorial'
          New-Item -ItemType Directory -Force .local | Out-Null
          New-Item -ItemType Junction -Path .local\env -Target $prefix | Out-Null
          & .\scripts\build-windows.ps1 -SkipGui
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            build-ci/test-results.xml
            build-ci/test-artifacts/
            build-ci/Testing/Temporary/LastTest.log
            reports/windows-local/
            build-win/test-artifacts/model-results.json
      # Native GUI rendering is tested locally on a real desktop, not claimed by CI.
